name: Windows
on: [push, pull_request]
jobs:
  text-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo check -p voxhold-native-rust
      - run: cargo test -p voxhold-api
