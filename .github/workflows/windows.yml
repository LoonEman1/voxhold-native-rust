name: Windows

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  text-client:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Check repository file limits
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-file-sizes.ps1 -All
      - name: Self-test file limit checker
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-file-sizes.ps1 -SelfTest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "false"
      # This compiles the workspace with default features and runs the GPUI,
      # API and media tests.
      - run: cargo test --workspace --locked

  package:
    if: github.event_name != 'pull_request'
    needs: text-client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "false"
      - run: cargo build --release --locked -p voxhold-native-rust
      - name: Package Windows client
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'target/voxhold-windows'
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item target/release/voxhold-native-rust.exe $bundle
          Copy-Item -Recurse assets $bundle
          foreach ($file in 'voxhold.ico', 'icons/brand.svg', 'icons/hash.svg', 'icons/news.svg', 'icons/volume.svg', 'icons/lock.svg', 'licenses/Inter-OFL.txt') {
            if (!(Test-Path -LiteralPath "$bundle/assets/$file" -PathType Leaf)) {
              throw "Missing asset $file"
            }
          }
          Compress-Archive -Path "$bundle/*" -DestinationPath target/voxhold-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: voxhold-windows
          path: target/voxhold-windows.zip
          compression-level: 0
          if-no-files-found: error
