name: Windows
on: [push, pull_request]
jobs:
  text-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      # Covers the app's in-process GPUI tests, the API tests and the media
      # tests. Media is part of the default feature set.
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p voxhold-native-rust
      - name: Package Windows client
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'target/voxhold-windows'
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item target/release/voxhold-native-rust.exe $bundle
          Copy-Item -Recurse assets $bundle
          foreach ($file in 'voxhold.ico', 'icons/brand.svg', 'icons/hash.svg', 'icons/news.svg', 'icons/volume.svg', 'icons/lock.svg', 'licenses/Inter-OFL.txt') {
            if (!(Test-Path -LiteralPath "$bundle/assets/$file" -PathType Leaf)) {
              throw "Missing asset $file"
            }
          }
          Compress-Archive -Path "$bundle/*" -DestinationPath target/voxhold-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: voxhold-windows
          path: target/voxhold-windows.zip
          if-no-files-found: error
