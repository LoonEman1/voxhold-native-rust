[package]
name = "voxhold-native-rust"
version = "0.2.1"
edition = "2021"
license.workspace = true

[workspace]
resolver = "2"
members = [
    "crates/voxhold-api",
    "crates/voxhold-media",
    "crates/voxhold-update",
    "crates/voxhold-updater",
    "crates/voxhold-release",
]

[workspace.package]
license = "Apache-2.0"

[features]
default = ["voxhold-media"]

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.3.0"
voxhold-api = { path = "crates/voxhold-api" }
voxhold-media = { path = "crates/voxhold-media", optional = true }
voxhold-update = { path = "crates/voxhold-update" }
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
image = "0.25"
smallvec = "1"
url = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
