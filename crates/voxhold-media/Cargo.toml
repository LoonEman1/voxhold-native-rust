[package]
name = "voxhold-media"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
libwebrtc = "=0.4.0"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
voxhold-api = { path = "../voxhold-api" }
