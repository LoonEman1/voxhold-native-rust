[package]
name = "voxhold-updater"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Small helper that waits for Voxhold to exit and applies a staged update"
build = "build.rs"

[dependencies]
voxhold-update = { path = "../voxhold-update" }
serde_json = "1"

[build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
